spring.application.name=order-service
server.port=8084

# --- Database: credentials come from environment variables, never from Git ---
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5434/orders_db}
spring.datasource.username=${ORDER_DB_USER:order_user}
spring.datasource.password=${SERVICES_DB_PASSWORD}

# --- JPA: Flyway owns the schema, Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- RabbitMQ: credentials come from environment variables, never from Git ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

# --- Messaging ---
messaging.orders.exchange=orders.events

# --- Business ---
order.currency=EUR

# --- Downstream services ---
services.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8081}
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8082}
services.payment.base-url=${PAYMENT_SERVICE_URL:http://localhost:8083}
services.http.connect-timeout-ms=2000
services.http.read-timeout-ms=3000

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Order keeps accepting orders when the broker is down, so the broker must not turn the service DOWN
management.health.rabbit.enabled=false