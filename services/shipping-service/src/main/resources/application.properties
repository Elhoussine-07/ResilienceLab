spring.application.name=shipping-service
server.port=8085

# --- Database: credentials come from environment variables, never from Git ---
spring.datasource.url=${SHIPPING_DB_URL:jdbc:postgresql://localhost:5434/shipping_db}
spring.datasource.username=shipping_user
spring.datasource.password=lawssin@

# --- JPA: Flyway owns the schema, Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- RabbitMQ: credentials come from environment variables, never from Git ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
# At most 10 unacknowledged messages in flight per consumer
spring.rabbitmq.listener.simple.prefetch=10

# --- Messaging ---
messaging.orders.exchange=orders.events
messaging.shipping.queue=shipping.order-confirmed

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true