spring.application.name=product-catalog-service
server.port=8081

# --- Database: credentials come from environment variables, never from Git ---
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://localhost:5434/catalog_db}
spring.datasource.username=${CATALOG_DB_USER:catalog_user}
spring.datasource.password=${SERVICES_DB_PASSWORD}

# --- JPA: Flyway owns the schema, Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Pagination guard ---
spring.data.web.pageable.max-page-size=100

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true