spring.application.name=notification-service
server.port=8086

# --- Database: credentials come from environment variables, never from Git ---
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5433/notification_db}
spring.datasource.username=${NOTIFICATION_DB_USER:notification_user}
spring.datasource.password=${SERVICES_DB_PASSWORD}

# --- JPA: Flyway owns the schema, Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- RabbitMQ: credentials come from environment variables, never from Git ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.listener.simple.prefetch=10

# --- Messaging ---
messaging.orders.exchange=orders.events
messaging.notification.queue=notification.order-events

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true